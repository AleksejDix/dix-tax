# Every push and every pull request runs what a person would otherwise have to remember.
# The type check earns its place on its own: renaming the product registry keys left
# app/utils/deadlines.ts on the old ids and the hub silently stopped showing its dates,
# because nothing was checking types at the time.
name: CI

on:
  push:
    branches: [main, growth]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # `nuxt prepare` runs as a postinstall hook and writes the generated types the
      # type check needs, so this has to come before it.
      - run: pnpm install --frozen-lockfile

      - name: Reference cases
        run: pnpm test

      - name: Types
        run: pnpm typecheck

      # The social images are committed, which means they can go stale the moment a title
      # changes and nobody would notice until a link was shared. Draw them again and fail if
      # the result differs from what is in the repository. `pnpm og` reads the product and
      # guide registries directly, which needs Node's TypeScript stripping, hence Node 24.
      - name: Social images are current
        run: |
          pnpm og
          if [ -n "$(git status --porcelain public/og)" ]; then
            echo "::error::Social images are out of date. Run 'pnpm og' and commit public/og."
            git status --porcelain public/og
            exit 1
          fi

      # Prerenders every route, so a broken page or a missing translation key fails here.
      - name: Build
        run: pnpm generate
